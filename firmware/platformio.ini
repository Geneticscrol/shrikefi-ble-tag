; PlatformIO project for ShrikeFi BLE Tag
; Build + flash:   pio run -e shrikefi -t upload && pio device monitor
;
; Which USB-C port?  ShrikeFi has two:
;   * CH9102 USB-UART port  -> use env "shrikefi"          (recommended, auto-reset works)
;   * native ESP32-S3 USB   -> use env "shrikefi_native_usb" (Serial over USB CDC)
; Not sure which is which? Plug in and check: the CH9102 port shows up as
; "USB Single Serial" / CH9102 (Windows: COMx, Linux: /dev/ttyACM0 or ttyUSB0, macOS: /dev/cu.wchusbserial*),
; the native port shows up as "USB JTAG/serial debug unit" (Espressif).

[platformio]
src_dir = ShrikeFiBleTag
default_envs = shrikefi

[env]
; pioarduino = community-maintained PlatformIO platform with Arduino-ESP32 3.x
; (same core version as the Arduino IDE board manager).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
; ShrikeFi docs list 8 MB flash in some places and 4 MB in others. This
; firmware is ~0.6 MB, so a 4 MB layout is used: it boots on both.
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

; Upload + Serial through the CH9102 USB-UART port (UART0, GPIO43/44)
[env:shrikefi]
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0

; Upload + Serial through the ESP32-S3 native USB port (USB Serial/JTAG)
[env:shrikefi_native_usb]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Same firmware on the official PlatformIO espressif32 platform
; (Arduino-ESP32 2.0.x, Bluedroid). Use if pioarduino gives you trouble.
[env:shrikefi_core2]
platform = espressif32@^6.9.0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
